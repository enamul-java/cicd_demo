name: Mobile Deployment

on:

  push:
    branches:
      - main2

  workflow_dispatch:
    inputs:

      platform:
        description: "Platform to deploy"
        required: true
        default: "android"

        type: choice

        options:
          - android
          - ios
          - both

      environment:
        description: "Deployment environment"
        required: true
        default: "internal"

        type: choice

        options:
          - internal
          - production


permissions:
  contents: read


jobs:

  android:

    name: Android Deployment

    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'both'

    runs-on: ubuntu-latest

    env:

      ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}

      GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}

      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2

        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true


      - name: Get Dependencies
        run: flutter pub get


      - name: Analyze
        run: flutter analyze


      - name: Test
        run: flutter test


      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks


      - name: Create key.properties
        run: |

          cat > android/key.properties <<EOF

          storePassword=${ANDROID_KEYSTORE_PASSWORD}

          keyPassword=${ANDROID_KEY_PASSWORD}

          keyAlias=${ANDROID_KEY_ALIAS}

          storeFile=upload-keystore.jks

          EOF


      - name: Setup Ruby
        uses: ruby/setup-ruby@v1

        with:
          ruby-version: "3.3"
          bundler-cache: true


      - name: Deploy Android Internal
        if: >
          github.event_name == 'push' ||
          github.event.inputs.environment == 'internal'

        run: |
          bundle exec fastlane android internal


      - name: Deploy Android Production
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'production'

        run: |
          bundle exec fastlane android production


      - name: Cleanup
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties


  ios:

    name: iOS Deployment

    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'ios' ||
      github.event.inputs.platform == 'both'

    runs-on: macos-latest

    env:

      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}

      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}

      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2

        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true


      - name: Get Dependencies
        run: flutter pub get


      - name: Analyze
        run: flutter analyze


      - name: Test
        run: flutter test


      - name: Setup Ruby
        uses: ruby/setup-ruby@v1

        with:
          ruby-version: "3.3"
          bundler-cache: true


      - name: Install CocoaPods
        run: |
          cd ios
          pod install


      - name: Deploy iOS TestFlight
        if: >
          github.event_name == 'push' ||
          github.event.inputs.environment == 'internal'

        run: |
          bundle exec fastlane ios beta


      - name: Deploy iOS Production
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'production'

        run: |
          bundle exec fastlane ios production